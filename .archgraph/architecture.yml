            the worker database for the whole process. On teardown it asserts
            the configured database's row counts are unchanged, then restores
            the original URL and stops isolation, which drops the worker
            database.
          inferenceReason: This fixture is the integration seam connecting the
            infrastructure lifecycle to all application tests.
