  - id: rule-issue-counting-ignores-marked-wrong
    type: domain
    name: Issue counting is independent of marked-wrong time
    description: Flagging a record's recorded time as inaccurate removes its
      DURATION from trusted analytics, but does not suppress the facts that the
      step completed or that it carried issues. Completion and issue counters
      are therefore applied regardless of recorded_time_marked_wrong, while the
      time sweep excludes flagged intervals into a separate wasted population.
      Recorded separately because the node that previously carried this rule
      described _apply_issues_at_completion, which no longer exists — the rule
      outlived its old anchor.
    tags:
