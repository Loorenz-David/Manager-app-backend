  - id: concept-attribution-split
    type: domain
    name: "Attribution Split: hours follow the record, completions follow the
      payload"
    description: >-
      OBSERVED BEHAVIOUR, not a judged defect. Two analytics effects of one
      transition attribute to potentially different workers.


      HOURS: derived from the closing record via `uid = r.credited_user_id or
      r.created_by_id`. Because the normal transition path opens new records
      WITHOUT setting credited_user_id, this falls through to created_by_id —
      i.e. whoever performed the transition that OPENED the interval.


      COMPLETIONS: derived from the outbox payload's credited_user_id — i.e.
      whoever the CLOSING request credited.


      They agree whenever the same person opened the interval and is credited on
      the close. They diverge when a manager opens a step themselves and then
      closes it crediting a worker: the completion lands on the worker, the
      hours and cost land on the manager.


      OPEN QUESTION for the team: credited_user_id is documented as the
      analytics attribution column, yet the main transition path never populates
      it on ordinary records (only auto-pause and case-pause records set it).
      Whether hours SHOULD follow credited_user_id is a product decision, not a
      code inconsistency — nothing here crashes or disagrees between copies.


      RELATED UNVERIFIED CONCERN: reconcile_user_day_time runs for the payload's
      credited user. In the divergent case that reconciles a user with no
      records on the step, and never reconciles the user who actually holds the
      interval; their day should self-heal on their next transition that date,
      since reconcile rebuilds the whole day.
    tags:
      - concept
      - attribution
      - gotcha
      - open-question
    metadata:
      evidence:
        - path: app/beyo_manager/services/commands/task_steps/transition_step_state.py
          symbol: transition_step_state
          startLine: 336
          endLine: 345
          summary: The newly opened StepStateRecord sets created_by_id=ctx.user_id and
            does NOT set credited_user_id, even when the request supplied one.
          inferenceReason: Because the column is left NULL on ordinary records, every
            downstream COALESCE falls back to the performer, which is what makes
            hours follow the opener rather than the credited worker.
        - path: app/beyo_manager/services/tasks/analytics/process_step_transition.py
          symbol: _recompute_step_time_totals
          startLine: 165
          endLine: 172
          summary: Builds per-user windows with `uid = r.credited_user_id or
            r.created_by_id`, reading attribution from the records themselves
            rather than from the payload.
          inferenceReason: This is the line that decides whose hours a step's intervals
            count toward, and it consults the record, not the event.
        - path: app/beyo_manager/services/tasks/analytics/process_step_transition.py
          startLine: 65
          endLine: 79
          summary: reconcile_user_day_time and apply_reconcile_deltas are both called with
            payload.credited_user_id, not with any id derived from the closing
            record.
          inferenceReason: Day-level reconciliation targets the payload's credited user,
            which can differ from the user the record-level sweep attributes to.
