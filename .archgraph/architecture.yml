  - id: decision-mirrored-transition-body
    type: decision
    name: Transition body mirrored, not shared (Option B)
    description: "The per-step transition body exists in THREE copies:
      transition_step_state (single-step),
      _step_transition_core._apply_step_transition (batch + case-pause), and
      finalize_pending_step_completion (deferred completion, further drifted).
      Only _ALLOWED_TRANSITIONS and _completed_the_whole_task are genuinely
      single-sourced by import. The copies are kept in sync by convention and an
      explicit DRIFT NOTE, accepted as Option B."
    tags:
