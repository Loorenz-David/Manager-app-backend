decisions:
  - itemId: edge:source-file-item-economics-budget-division--implements-->projection-working-section-typical-times
    decision: reject
    previousOrigin: ai_inferred
    rationale: "Wrong as always. budget_division.py contains no SQL and no query
      construction — verified by reading: it holds only the M1/M2 constants
      (:14-17) and the pure divide_production_budget function (:78-191). The
      typical-times projection is implemented by
      get_working_section_typical_times.py, whose typical_times_statement()
      builds the grouped-median SQL (percentile_cont at :42) and merely IMPORTS
      those three constants. The item's own inferenceReason concedes this ('the
      SQL projection itself is implemented by its query service'), and its 0.35
      confidence is the engine's own signal. Supplying shared constants is not
      implementing; recording it as such would make a future reader look for the
      typicals SQL in the wrong file. Rejected rather than deprecated: it was
      never true, so there is no provenance to preserve."
  - itemId: edge:source-file-item-economics-budget-division--implements-->projection-item-economics-task-budget-allocations
    decision: promote
    previousOrigin: ai_inferred
    resultingOrigin: human_confirmed
    rationale: "Verified by reading divide_production_budget (:78-191): it is the
      arithmetic the allocations projection surfaces — per-step allowance,
      left_seconds and share_state all originate there (exact Fraction weights,
      largest-remainder rounding, NULL-safe tie key). The source file is
      genuinely the implementation anchor for that projection's computation. The
      flagged contradiction was mutual exclusivity against the sibling
      implements edge being rejected in this same set, so it resolves here."
  - itemId: node:source-file-item-economics-budget-division
    decision: promote
    previousOrigin: ai_inferred
    resultingOrigin: human_confirmed
    rationale: "File exists and is the pipeline's registered pure-domain module
      (master plan §4): owns
      TYPICAL_WINDOW_DAYS/TYPICAL_MIN_SAMPLE_SIZE/TYPICAL_METHOD/ALLOCATION_MET\
      HOD/EXCLUDED_STEP_STATES and divide_production_budget. Read this session."
  - itemId: node:projection-item-economics-task-budget-allocations
    decision: promote
    previousOrigin: ai_inferred
    resultingOrigin: human_confirmed
    rationale: "Verified: a read-only projection, nothing persisted (HC-2). Divides
      a task's allowed_worker_minutes across its live steps weighted by section
      typicals; returns per-step allowance/left/share_state plus task figures.
      Implemented by get_task_budget_allocations.py over the pure function."
  - itemId: node:projection-working-section-typical-times
    decision: promote
    previousOrigin: ai_inferred
    resultingOrigin: human_confirmed
    rationale: "Verified: read-only projection computing, per working section, the
      median of (task, section) completed-step total-seconds groups over a
      90-day window admitted by MAX(closed_at), NULL below 5 qualifying groups.
      No persistence."
  - itemId: node:endpoint-item-economics-task-budget-allocations
    decision: promote
    previousOrigin: ai_inferred
    resultingOrigin: human_confirmed
    rationale: Route verified this session on the item-economics router (GET
      /tasks/budget-allocations), declared above the parameterized
      /tasks/{task_client_id} block, require_roles ADMIN/MANAGER/WORKER/SELLER,
      repeatable task_ids capped at 50 with
      BUDGET_ALLOCATIONS_TOO_MANY_TASK_IDS. Also mirrored in both v1
      route-mirror tests (HC-1a) and routers/README.md.
  - itemId: node:endpoint-working-section-typical-times
    decision: promote
    previousOrigin: ai_inferred
    resultingOrigin: human_confirmed
    rationale: Route verified this session on the working-sections router (GET
      /typical-times), declared ABOVE the /{working_section_id} param route so
      it is not shadowed (projection P7; guarded by a service-identity assertion
