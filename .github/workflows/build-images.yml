# build-images.yml for Loorenz-David/Manager-app-backend (P1). Copy unchanged to .github/workflows/build-images.yml
# in that repository: the AWS role mb-ci-build-backend trusts ONLY this file, on refs/heads/main, of this repository
# (immutable repository/owner IDs). A run on any other branch is refused by AWS by design.
name: build-images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      immutability_test:
        description: "P1 acceptance: push two different images to one throw-away tag and require ECR to refuse the second"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  REGISTRY: 307946675015.dkr.ecr.eu-north-1.amazonaws.com
  IMAGE: managerbeyo-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::307946675015:role/mb-ci-build-backend
          role-session-name: gh-build-backend-${{ github.run_id }}
          aws-region: eu-north-1
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Build and push (linux/amd64, tag = commit SHA, never latest)
        run: |
          set -euo pipefail
          REF="$REGISTRY/$IMAGE:$GITHUB_SHA"
          if aws ecr describe-images --repository-name "$IMAGE" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "$REF already exists (tags are immutable); not rebuilding."
          else
            docker build --platform linux/amd64 \
              --build-arg GIT_COMMIT="$GITHUB_SHA" --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -t "$REF" app
            docker push "$REF"
          fi
          DIGEST=$(aws ecr describe-images --repository-name "$IMAGE" --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          { echo "### $IMAGE"; echo "- tag: \`$GITHUB_SHA\`"; echo "- digest: \`$DIGEST\`"; } >> "$GITHUB_STEP_SUMMARY"
      - name: P1 acceptance - tag overwrite must be refused (throw-away tag, real tags untouched)
        if: ${{ inputs.immutability_test }}
        run: |
          set -euo pipefail
          TAG="immutability-test-$GITHUB_RUN_ID"
          T="$REGISTRY/$IMAGE:$TAG"
          BASE=public.ecr.aws/docker/library/busybox:stable
          docker pull "$BASE"
          # Two images that differ only by a label (one pull, no rate-limit exposure), same tag.
          printf 'FROM %s\nLABEL mb.variant=a\n' "$BASE" | docker build -q -t "$T" -
          docker push "$T"
          FIRST=$(aws ecr describe-images --repository-name "$IMAGE" --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
          printf 'FROM %s\nLABEL mb.variant=b\n' "$BASE" | docker build -q -t "$T" -
          SECOND_LOCAL=$(docker inspect --format '{{.Id}}' "$T")
          echo "first pushed digest: $FIRST; second local image: $SECOND_LOCAL"
          if docker push "$T"; then echo "FAIL: ECR accepted a different image for $TAG"; exit 1; fi
          AFTER=$(aws ecr describe-images --repository-name "$IMAGE" --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
          [ "$AFTER" = "$FIRST" ] || { echo "FAIL: $TAG now points to $AFTER"; exit 1; }
          echo "PASS: ECR refused a different image for $TAG; it still points to $FIRST" | tee -a "$GITHUB_STEP_SUMMARY"
