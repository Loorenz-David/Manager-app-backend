  - id: infrastructure-test-database-isolation
    type: infrastructure
    name: Per-process test database isolation
    description: "Gives each pytest process its own disposable PostgreSQL database,
      created fresh from a migrated template and dropped at session end, so the
      suite never reads or writes the development database. It owns the
      per-process lifecycle end to end — template provisioning, worker-database
      creation from that template, the disposability marker, redirection of the
      application's database seam (settings.database_url) and teardown — but not
      the data the tests then need: the template carries migrated schema only,
      and every reference row is created by fixtures, so there is no seeded
      baseline inside it. Database names are slot-scoped, so two checkouts of
      this repository pointed at one PostgreSQL server cannot destroy each
      other's databases. What must stay true: every destructive operation passes
      the fail-closed disposability invariant before a DROP, so no name,
      endpoint or identity mistake can reach the configured database; pre-slot
      legacy names are reclaimed only under an explicit opt-in environment flag,
      never by default; and the session restores the original database URL and
      asserts the development database's row counts are unchanged before it
      stops. The mechanism is per-process by construction rather than serial —
      the worker id is part of the name, so running under pytest-xdist changes
      the worker id, not the design."
    tags:
      - tests
      - postgresql
      - pytest
    metadata:
      evidence:
        - path: app/tests/database_isolation.py
          symbol: DatabaseIsolation.start
          summary: Session start snapshots the configured database's row counts unless the
            configured database is itself a test database, reclaims pre-slot
            legacy databases only when BEYO_RECLAIM_LEGACY_TEST_DATABASES is set
            to 1, ensures the template exists and is current, then drops any
            leftover of the slot-scoped worker name, recreates it from the
            template and marks it. Any exception or KeyboardInterrupt triggers a
            best-effort drop of that worker database before re-raising.
          inferenceReason: This is the executable ownership boundary for process-local
            test database creation and cleanup.
        - path: app/tests/database_isolation.py
          symbol: DatabaseIsolation._drop_database_if_exists
          summary: "The single destructive path. It returns early if the database does not
            exist, inspects it, and passes the result to
            assert_disposable_database (lines 81-107) before terminating other
            backends and issuing DROP DATABASE. That guard enforces five checks:
            a disposable name pattern (slot-scoped or legacy), endpoint
            confinement to the configured server, non-identity with the
            configured (host, port, database) tuple, a disposability marker OR
            zero public tables, and a parseable PostgreSQL URL carrying host,
            username and database."
          inferenceReason: These five checks are the fail-closed safety invariant that
            prevents the test lifecycle from ever targeting the development
            database.
        - path: app/tests/conftest.py
          symbol: isolated_database
          summary: The session-scoped fixture refuses to run without a configured
