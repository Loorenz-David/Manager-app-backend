  - id: concept-step-state-machine
    type: domain
    name: Step State Machine (8 states)
    description: "Eight step states with a hard-coded legality map:
      PENDING->{WORKING}; WORKING->{PAUSED,COMPLETED,FAILED,CANCELLED};
      PAUSED->{WORKING,FAILED,CANCELLED}; terminal states and BLOCKED have no
      outgoing transitions. Note the seam: the vocabulary lives in domain/ but
      the machine itself lives in services/."
    tags:
      - concept
      - state-machine
    metadata:
      evidence:
        - path: app/beyo_manager/services/commands/task_steps/transition_step_state.py
          symbol: _ALLOWED_TRANSITIONS
          startLine: 54
          endLine: 70
          summary: Dict mapping each TaskStepStateEnum to the set of legal next states;
            terminal states map to empty sets.
          inferenceReason: An explicit legality table checked before every transition is
            the authoritative definition of the state machine.
        - path: app/beyo_manager/services/commands/tasks/force_task_ready.py
          symbol: _FORCE_READY_TRANSITIONS
          startLine: 71
          endLine: 76
          summary: A parallel transition map allowing any open state (including BLOCKED)
            to go to SKIPPED.
          inferenceReason: A second map bypassing the main one shows the machine has a
            deliberate administrative escape hatch.
    origin: ai_inferred
    confidence: 0.95
