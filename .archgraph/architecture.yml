  - id: decision-money-audience-admin-manager-only
    type: decision
    name: "Money audience: ADMIN/MANAGER only"
    description: "Monetary fields are served to ADMIN and MANAGER identities only;
      WORKER and SELLER are both excluded, everywhere, in every payload family.
      Excluding SELLER alongside WORKER was the contested half — a seller
      previously saw the step cost number on task detail and no longer does. Two
      mechanisms were rejected in favour of the shipped ones: a role check
      inside each serializer, and a single serializer with a defaulted
      include-money flag; both fail open as soon as a new call site appears.
      What must stay true: a withheld monetary key is ABSENT from the payload,
      never null, because a null key still discloses that a cost exists; the
      step serializer's include_monetary parameter stays keyword-only with NO
      default, so an unconverted call site raises rather than leaking; the flag
      is derived from the request identity once inside each shared payload
      builder, so endpoints riding a builder inherit the redaction; and the
      worker-facing budget status stays a SEPARATE query service with a
      serializer carrying no monetary keys at all, rather than becoming a flag
      on the manager serializer. This boundary spans two payload families and is
      not owned by one domain: task-step cost belongs to worker compensation,
      item-economics figures to item economics."
    tags:
      - security-boundary
      - roles
      - money
    metadata:
      evidence:
        - path: app/beyo_manager/domain/tasks/serializers.py
          symbol: include_monetary_step_fields
          summary: A single predicate answers whether a role may receive a step's monetary
            fields, admitting exactly RoleNameEnum.ADMIN and
            RoleNameEnum.MANAGER and nothing else.
          inferenceReason: One named predicate enumerating the admitted roles is the
            audience policy itself, not a caller of it — every redacting site
            derives its flag from this function.
        - path: app/beyo_manager/domain/tasks/serializers.py
          symbol: serialize_step
          summary: serialize_step declares include_monetary as keyword-only with no
            default value.
          inferenceReason: "A required keyword-only flag is the fail-closed construction
            the policy specifies: a call site that omits it raises TypeError
            instead of silently emitting money."
        - path: app/beyo_manager/routers/api_v1/item_economics.py
          symbol: _run_budget_status
