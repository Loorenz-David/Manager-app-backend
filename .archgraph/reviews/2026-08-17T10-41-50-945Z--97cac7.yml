    previousOrigin: ai_inferred
    resultingOrigin: human_confirmed
    rationale: "Best available placement, checked deliberately: the endpoint and
      query service sit under working-sections, but no working-sections domain
      node exists (only domain-task-execution, which owns steps and the state
