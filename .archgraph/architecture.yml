  - id: projection-item-economics-task-budget-allocations
    type: projection
    name: Task budget allocations
    description: The batched, read-only task view combines current committed
      evaluation budgets, non-deleted live steps, item-category-narrowed
      typical-time evidence, and item-economics readiness into per-step
      allowances. It derives one filter spec per task, deduplicates equal specs
      into an ordered sequence, issues one typical-times statement for the
      batch, and maps each task to its spec position; a non-narrowing task uses
      spec_index None and resolves against the spec-independent section-wide
      columns. Participating sections are reconciled through uniform_basis_v1
      and excluded sections resolve independently, so one task-wide basis
      governs the selected typicals used both for displayed step values and for
      division weights; the response exposes typical_resolution, per-step
      typical_basis and sample_count, and allocation_method
      static_proportional_section_v2. Each step's worked-seconds input remains
      its settled working seconds plus the concurrency-averaged share of any
      open WORKING interval, taken from one shared live-worked-seconds map
      loaded once per request and persisted nowhere. It omits unknown or
      cross-workspace tasks, charges non-deleted excluded steps, and degrades
      evaluation-less tasks to explicit no-budget states without persisting
      derived values; its time-only fields reconcile with the same non-deleted
      step set used by budget status.
