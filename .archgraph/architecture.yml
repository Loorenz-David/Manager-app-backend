    description: Creates a task and its PRIMARY item binding, resolving or creating
      the item inside the caller-owned transaction. When the request carries an
      inline amount and the matched item already has a current valuation, it
      inherits any omitted amount from that valuation and advances the chain
      only when the resulting expected sale price, purchase cost and currency
      differ from the current row; identical effective values write nothing at
      all. A newly created or never-valued item gets the first chain row. Chain
      advancement is delegated to the shared item valuation writer, and the
      command records the item_valuation.created audit event only when a row is
      written; all of this happens before the auto-commit savepoint. The same
      command then runs best-effort item-cost auto-commit against the task and
      resolved item.
