  - id: decision-idempotent-completion-counters
    type: decision
    name: Completion counters are recompute-and-SET, not increment
    description: "Completion and issue counters were blind `+= 1` increments. The
      analytics queue is at-least-once (the handler commits in its own session;
      the task is marked COMPLETED in a later one), so any failure between those
      two commits re-ran the handler and inflated the counters permanently.
      Verified live: replaying one real transition twice drove a step's
      completion count from 1 to 3. They now follow the same recompute-and-SET
      contract as time. SUPERSEDES the increment behaviour described by the (now
      deleted) _apply_step_completed / _apply_issues_at_completion."
    tags:
      - decision
      - idempotency
      - supersedes
    metadata:
      evidence:
        - path: app/beyo_manager/services/tasks/analytics/process_step_transition.py
          startLine: 88
          endLine: 117
          summary: The COMPLETED branch now calls reconcile_user_day_completions +
            apply_completion_reconcile_deltas +
            _recompute_step_completion_totals instead of incrementing.
          inferenceReason: Replacing increments with a recompute at the only
            completion-counting site is the decision being recorded.
        - path: app/beyo_manager/services/infra/execution/worker_base.py
          startLine: 84
          endLine: 108
          summary: _process_task runs the handler in one session then marks the task
            COMPLETED in a separate _finalize_task session; failure in between
            routes to _fail_task and retries.
          inferenceReason: The non-atomic handler-commit vs task-finalize is the mechanism
