          summary: "The COMPLETED branch is commented 'Applies regardless of
            recorded_time_marked_wrong: inaccurate time does not suppress the
            fact that the step completed or that it carried issues.' and is
            gated only on state, never on the flag."
          inferenceReason: The gate deliberately omits the inaccuracy flag that the time
            path honours, which makes the independence a rule rather than an
            oversight.
        - path: app/beyo_manager/domain/analytics/concurrency.py
