  - id: decision-transactional-outbox
    type: decision
    name: Transactional outbox for analytics
    description: Analytics is never computed inline. Commands write an ExecutionTask
      + ExecutionPayload row via create_instant_task inside the caller's
      transaction (flush only, no commit), so the outbox row commits atomically
      with the domain write. A Postgres trigger then NOTIFYs a router which
      pushes the id onto a Redis queue.
    tags:
      - decision
      - async
    metadata:
      evidence:
        - path: app/beyo_manager/services/infra/execution/task_factory.py
          symbol: create_instant_task
          startLine: 10
          endLine: 46
          summary: Inserts task and payload rows and only flushes, never commits.
          inferenceReason: Flushing without committing inside the caller's transaction is
            the defining property of the transactional-outbox pattern.
    origin: ai_inferred
    confidence: 0.95
    createdAt: 2026-08-11T08:38:59.972Z
    updatedAt: 2026-08-11T08:38:59.972Z
  - id: decision-recompute-not-increment
    type: decision
    name: Recompute-and-SET rather than increment (time)
    description: Because the concurrency sweep is a deterministic function of raw
      StepStateRecord rows, time aggregates are recomputed over a window and SET
      absolutely, making them idempotent and safely replayable. Only the roll-up
      sums that span users/days (lifetime, section-daily) are applied as deltas,
      and completion/issue counters are true increments.
    tags:
      - decision
      - idempotency
    metadata:
      evidence:
        - path: app/beyo_manager/services/queries/analytics/reconcile_user_time.py
          symbol: reconcile_user_day_time
          startLine: 256
          endLine: 337
          summary: Recomputes a worker's day over a +/-1d window and SETs the
            daily/section-daily values, returning deltas.
          inferenceReason: Absolute SET plus returned deltas shows a deliberate split
            between recomputable projections and non-recomputable sums.
        - path: app/beyo_manager/services/queries/analytics/reconcile_user_time.py
          symbol: apply_reconcile_deltas
          startLine: 338
          endLine: 345
          summary: Applies deltas to lifetime and section-daily tables because they are
            sums over users/days and cannot be SET.
          inferenceReason: The explicit justification for delta application confirms the
            idempotency boundary.
    origin: ai_inferred
    confidence: 0.9
    createdAt: 2026-08-11T08:38:59.972Z
    updatedAt: 2026-08-11T08:38:59.972Z
