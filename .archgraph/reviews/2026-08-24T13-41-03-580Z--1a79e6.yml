decisions:
  - itemId: edge:command-task-create--reads_from-->table-customer
    decision: reject
    previousOrigin: ai_inferred
    rationale: "D32. Relationship is true but its evidence states a mechanism that
      does not exist: the summary claims create_task 'copies
      Customer.display_name into the task snapshot' and the inferenceReason
      names customer_name_snapshot. Measured 2026-08-24: customer_name_snapshot
      appears 0 times under beyo_manager/, and customer.display_name is read 0
      times in create_task.py. What the command actually copies from the
      Customer row is contact data (create_task.py:178-181). Evidence summaries
      are immutable, so this is rejected and re-recorded with accurate
      evidence."
  - itemId: node:table-customer
    decision: reject
    previousOrigin: ai_inferred
    rationale: "D32. The node and its description are correct, but its evidence
      inferenceReason asserts the same false mechanism -- 'the customer registry
      source from which task creation reads the canonical display name'.
      Measured: create_task reads contact fields from the Customer row, and
      takes display_name from the request, not from this model. Rejected and
      re-recorded with accurate evidence rather than promoted with a false
      reason."
