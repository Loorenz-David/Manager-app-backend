  - id: concept-one-active-step-per-user
    type: domain
    name: One Active Step Per User (Auto-Pause)
    description: A user may hold at most one open WORKING record unless the step
      sets allows_batch_working. Entering WORKING auto-closes any conflicting
      record with transition_reason OTHER_TASK_PRIORITY. The guard checks both
      the performer and the credited user, so it holds when a manager acts on a
      worker's behalf.
    tags:
