    after:
      description: "Redis list carrying execution task ids for analytics work. Two
        task types route here since phase 8: PROCESS_STEP_TRANSITION and
        PROCESS_ITEM_COST_RESULT (task_router.py maps both to queue:analytics).
        Ids only — payloads stay in Postgres."
    rationale: "A16 discrepancy filing: 'Only PROCESS_STEP_TRANSITION routes here'
      was true when recorded and became false when phase 8 landed the second
      analytics task type — read from task_router.py this session."
  - itemId: node:infra-analytics-worker
    kind: edit
    before:
      description: Consumes queue:analytics. Its HANDLER_MAP binds
        PROCESS_STEP_TRANSITION to handle_process_step_transition. The only
        consumer of step transition events.
    after:
      description: Consumes queue:analytics. Its HANDLER_MAP binds
        PROCESS_STEP_TRANSITION to handle_process_step_transition and, since
        phase 8, PROCESS_ITEM_COST_RESULT to handle_process_item_cost_result
        (analytics_worker.py:11-14). The only consumer of step transition and
        item-cost-result events.
    rationale: "A16 discrepancy filing: the single-handler claim became false at
      phase 8 — HANDLER_MAP read at :11-14 this session."
  - itemId: node:analytics-process-step-transition
    kind: edit
    before:
      description: "THE analytics entry point. Rehydrates StepTransitionPayload, then:
        (1) if closing_state is time-bearing AND credited_user_id is set,
        reconciles the user's day totals and recomputes step time totals; (2)
        reconciles worker shift state on every credited transition regardless of
        closing_state; (3) if new_state == COMPLETED, applies completion and
        issue counters; (4) emits a shift realtime event only when the reconcile
        reports a change. Note the two gates are independent — a transition can
        trigger one, both or neither."
    after:
      description: "THE analytics entry point for step transitions. Rehydrates
        StepTransitionPayload, then: (1) if closing_state is time-bearing AND
        credited_user_id is set, reconciles the user's day totals and recomputes
        step time totals; (2) reconciles worker shift state on every credited
        transition regardless of closing_state; (3) if new_state == COMPLETED,
        applies completion and issue counters; (4) emits a shift realtime event
        only when the reconcile reports a change; (5) since phase 8, inside the
        time-bearing branch after the recompute, enqueues one
        PROCESS_ITEM_COST_RESULT for the step's task iff the task state is READY
        or terminal (the §8A.5 straggler re-emit). The gates are independent — a
        transition can trigger any subset."
    rationale: "A16 discrepancy filing: the four-effect enumeration gained a fifth
      at phase 8 (the guarded re-emit, read at process_step_transition.py this
      session); P-AB-style enumeration corrected by reading the code, not the
      model of it."
