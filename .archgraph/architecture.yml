  - id: decision-credited-user-no-fk
    type: decision
    name: credited_user_id carries no DB foreign key
    description: 'StepStateRecord.credited_user_id is stored without a foreign-key
      constraint, by design. The column comment gives two reasons: it is an
      approximate-analytics reference rather than a referential one, and
      omitting the FK keeps the add-column migration lock-free on this
      high-volume table. Contrast created_by_id and deleted_by_id, which both
      carry ForeignKey("users.client_id", ondelete="RESTRICT").'
    tags:
      - decision
      - schema
