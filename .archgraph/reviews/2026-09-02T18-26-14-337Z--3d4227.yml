      missing (l.148-161), deletes PauseReasonUserLink for the managed reason
      ids (l.166) and clears PauseReasonWorkingSectionLink (l.172) before
      recreating the user links. bootstrap_app.py:bootstrap_app calls it at
      l.65, after seed_workers at l.58, so the stated phase ordering holds. Both
      evidence entries anchor on the symbols that are the thing, not on callers.
