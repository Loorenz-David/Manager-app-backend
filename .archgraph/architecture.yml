          startLine: 4
          endLine: 20
          summary: Frozensets TERMINAL_STEP_STATES, TIME_BEARING_STATES and
            TERMINAL_TASK_STATES.
          inferenceReason: Two separately-named frozensets over the same enum imply two
            independent partitions used for different purposes.
        - path: app/beyo_manager/services/tasks/analytics/process_step_transition.py
          startLine: 65
          endLine: 79
          summary: Time recomputation is gated on `closing_state in TIME_BEARING_STATES`.
          inferenceReason: The analytics worker branches on the time-bearing set,
            confirming it gates duration accounting specifically.
    origin: ai_inferred
    confidence: 0.95
    createdAt: 2026-08-11T08:38:59.972Z
    updatedAt: 2026-08-11T08:38:59.972Z
  - id: concept-readiness-gating
    type: domain
    name: Step Readiness / Dependency Gating
    description: "A step's readiness_status is a pure function of two denormalised
      counters (total_dependencies, completed_dependencies), never a live query:
      0 deps or all complete -> READY, none complete -> BLOCKED, otherwise
      PARTIAL. Completing a step cascades increments to dependents."
