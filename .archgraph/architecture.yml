  - id: concept-terminal-vs-time-bearing
    type: domain
    name: Terminal vs Time-Bearing States
    description: Two orthogonal state partitions drive different machinery.
      TERMINAL_STEP_STATES={COMPLETED,SKIPPED,FAILED,CANCELLED} means no further
      transitions and closes the step. TIME_BEARING_STATES={WORKING,PAUSED}
      means the interval's duration counts toward analytics. A transition can be
      terminal without being time-bearing and vice versa.
