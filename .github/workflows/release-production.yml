# release-production.yml for Loorenz-David/Manager-app-backend. Copy unchanged to .github/workflows/release-production.yml
# in that repository: the AWS role mb-prod-release-backend trusts ONLY this file, on refs/heads/main, of this
# repository, running in the GitHub Environment "production" (Settings > Environments: add yourself as a required
# reviewer there to get a confirmation step before anything runs).
#
# Manual only ("Run workflow"). Deploys an image that build-images already built — it never builds.
# Backend: runs the database migrations, restarts the application (about 1-2 minutes) and checks readiness.
# Rollback = run it again with the previous commit SHA.
name: release-production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA (40 hex) to release. Empty = the latest commit on main."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  DOCUMENT: MB-Deploy
  INSTANCE: i-0d778f1f4ad5e2935
  IMAGE: managerbeyo-backend
  STATUS_URL: https://manager.beyoworkaroundtheclock.com/system/status
  WAKE_URL: https://manager.beyoworkaroundtheclock.com/system/wake
  TITLE: "Production: backend"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Which commit
        id: pick
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          SHA="${INPUT_SHA:-$GITHUB_SHA}"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be 40 hex characters"; exit 1; }
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::307946675015:role/mb-prod-release-backend
          role-session-name: gh-release-backend-${{ github.run_id }}
          aws-region: eu-north-1
      - name: The image of this commit exists
        run: |
          aws ecr describe-images --repository-name "$IMAGE" --image-ids imageTag="$SHA" --query 'imageDetails[0].imageDigest' --output text \
            || { echo "No image for $SHA: wait for build-images to finish, or check the SHA."; exit 1; }
      - name: Make sure production is awake (it may be asleep outside working hours)
        run: |
          set -euo pipefail
          state() { curl -fsS -m 10 "$STATUS_URL" | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])' 2>/dev/null || echo UNKNOWN; }
          S=$(state); echo "state: $S"
          if [ "$S" != READY ]; then
            curl -fsS -m 10 -X POST "$WAKE_URL" >/dev/null || true
            for i in $(seq 1 90); do sleep 10; S=$(state); echo "state: $S"; [ "$S" = READY ] && break; done
          fi
          [ "$S" = READY ] || { echo "Production did not become ready within 15 minutes; nothing was deployed."; exit 1; }
      - name: Deploy to production and wait for the result
        run: |
          set -euo pipefail
          # Both repositories deploy to the same server, one at a time (the server's deploy lock). If the other one is
          # deploying right now, wait and try again instead of failing.
          for attempt in 1 2 3 4 5 6 7 8; do
            CMD=$(aws ssm send-command --document-name "$DOCUMENT" --instance-ids "$INSTANCE" \
              --comment "$GITHUB_REPOSITORY run $GITHUB_RUN_ID" \
              --parameters "BackendTag=$SHA" --query Command.CommandId --output text)
            echo "command: $CMD (attempt $attempt)"
            STATUS=Pending
            for i in $(seq 1 180); do
              sleep 10
              STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
              case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
            done
            OUT=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
              --query '[StandardOutputContent,StandardErrorContent]' --output text)
            if [ "$STATUS" != Success ] && grep -q 'another deploy, rollback, start or drain is running' <<<"$OUT"; then
              echo "The server is busy with another deploy; trying again in 45 seconds."
              sleep 45
              continue
            fi
            break
          done
          tail -n 40 <<<"$OUT"
          { echo "### $TITLE"; echo "- commit: \`$SHA\`"; echo "- result: **$STATUS**"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = Success ] || { echo "The deploy did not succeed ($STATUS). The previous version keeps running unless the log above says otherwise."; exit 1; }
