  - id: test-database-isolation-contract
    type: configuration
    name: Test database isolation contract
    description: "The rules that decide which PostgreSQL database a test process may
      create, reuse and destroy, and the operator-facing switches that select
      them. It fixes the name grammar — beyo_test_<slot>_(template|main|gw<n>),
      slot [a-z0-9]{1,12}, resolved from the BEYO_TEST_SLOT environment
      variable, then settings.test_slot, then the default 'main', with invalid
      values raising rather than being normalised — the template acceptance
      rules (marker present, Alembic head and public-table count both as
      expected, and no legacy baseline_source column), and the five-part
      fail-closed invariant every destructive operation must satisfy: disposable
      name pattern, endpoint confinement to the configured server, non-identity
      with the configured (host, port, database) tuple, marker present or a
      table-less shell, and a parseable PostgreSQL URL carrying host, username
      and database. It also carries the opt-in reclamation flag
      BEYO_RECLAIM_LEGACY_TEST_DATABASES, without which pre-slot database names
      are left untouched. What must stay true: the name set stays bounded by
      construction — slots times workers-plus-one, and a slot exists only
      because a human declared one — the template is never named after a
      migration head, and the development database is compared against a
      snapshot taken at session start rather than against any fixed row count."
    tags:
      - tests
      - pytest
      - postgresql
    metadata:
      evidence:
        - path: app/tests/database_isolation.py
          symbol: resolve_worker_database_name
          summary: Worker ids resolve to slot-scoped names of the form
            beyo_test_<slot>_<worker>. The worker segment is 'main' when
            PYTEST_XDIST_WORKER is unset or empty and must otherwise match
            gw<n>; anything else raises UnsafeDatabaseError. The serial default
            is beyo_test_main_main. The unslotted names beyo_test_main and
            beyo_test_gwN are legacy and can no longer be produced here.
          inferenceReason: The bounded resolver defines the database identity contract for
            serial execution and for xdist worker processes, and the slot
            segment is what keeps two checkouts on one server from colliding.
        - path: app/tests/database_isolation.py
          symbol: DatabaseIsolation._migrate_and_assert
          summary: "Template migration runs a real Alembic upgrade in a subprocess and
            then asserts the DDL actually landed: the expected head revision,
            the expected public-table count, three required tables, and the
            disposability marker. A zero exit code alone is never accepted as
            evidence that the migration persisted anything."
          inferenceReason: The lifecycle contract is anchored to asserted schema rather
            than a command exit code, which this project's Alembic env.py trap
            is known to fake.
        - path: app/tests/integration/infrastructure/test_database_isolation.py
          symbol: test_dev_database_counts_are_untouched
          summary: The test compares the configured database's row counts against the
            snapshot taken at session start rather than against any fixed
            number, asserts the active application database is the worker
            database, and asserts that an isolation instance carrying no
            baseline never reads row counts at all.
          inferenceReason: This test encodes the externally observable non-mutation
            guarantee for the development database, in the only form that can
            distinguish broken isolation from the owner adding a workspace.
