  - id: concept-concurrency-averaged-time
    type: domain
    name: Concurrency-Averaged Time Accounting
    description: A worker doing batch work holds several steps open at once, so
      naively summing wall durations multiplies one real hour into N. Within one
      worker and one state bucket, each instant is divided equally among the
      batchable intervals open at that instant, so N steps open for D each earn
      D/N and the batch sums back to real wall-clock time. Non-batchable steps
      always earn full duration and never enter anyone's divisor.
    tags:
      - concept
      - analytics
      - algorithm
    metadata:
      evidence:
        - path: app/beyo_manager/domain/analytics/concurrency.py
          symbol: _sweep
          summary: Sweep-line over sorted interval boundaries; for each segment the open
            set is constant so share = segment_seconds / k is added to every
            open record.
          inferenceReason: The equal-division-per-segment math is the precise definition
            of the averaging rule.
        - path: app/beyo_manager/services/queries/analytics/averaged_time.py
          symbol: compute_record_contributions
          summary: Shared IO primitive loading a user's overlapping WORKING/PAUSED records
            joined to TaskStep for allows_batch_working, then running the
            sweeps.
          inferenceReason: Every consumer routing through one primitive makes the
            averaging a single-sourced, reproducible projection.
      evidenceHistory:
