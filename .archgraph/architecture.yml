      - drift-risk
    metadata:
      evidence:
        - path: app/beyo_manager/services/commands/task_steps/_step_transition_core.py
          startLine: 3
          endLine: 11
          summary: DRIFT NOTE docstring stating the core MIRRORS transition_step_state and
            any change to either MUST be evaluated for the other, kept in sync
            by convention (Option B).
          inferenceReason: An explicit, named decision recorded in code to duplicate
            rather than share is an architectural decision with ongoing
            maintenance cost.
        - path: app/beyo_manager/services/commands/task_steps/transition_step_state.py
          startLine: 116
          endLine: 121
          summary: The mirrored DRIFT NOTE on the single-step side pointing back at the
